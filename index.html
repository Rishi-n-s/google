<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Gemini Student Ambassador Portal</title>
  
  <link rel="icon" type="image/png" href="assets/gemini-sparkle.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            portalBlue: '#346BF1',
            portalBlueHover: '#2851C6',
            portalLight: '#F8FAFF',
            portalActiveNav: '#EEF4FE'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'Inter', 'sans-serif'],
            certificate: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col h-screen bg-[#F8FAFF] font-sans relative overflow-hidden">

  <!-- Subtle Repeating Diagonal Stripes Background -->
  <div class="absolute inset-0 pointer-events-none z-0 bg-portal-stripes"></div>

  <!-- Top Header with Role Switcher -->
  <header class="px-4 md:px-8 py-3 flex items-center justify-between z-20 relative bg-white border-b border-gray-200 shadow-xs">
    <div class="flex items-center space-x-3">
      <!-- Mobile Sidebar Toggle -->
      <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-gray-600 hover:bg-gray-100" aria-label="Toggle Navigation">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>

      <!-- Official Logo Lockup -->
      <div class="h-9 cursor-pointer" onclick="handleLogoClick()">
        <img src="assets/logo-04-header.png" alt="Google Student Ambassador" class="h-full w-auto object-contain">
      </div>
    </div>

    <!-- Center/Right: Role Switcher & Header Controls -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <!-- Role Switcher Segmented Control -->
      <div class="bg-gray-100 p-1 rounded-full flex items-center border border-gray-200 text-xs font-semibold">
        <button onclick="setRole('ambassador')" id="btn-role-ambassador" class="px-3.5 py-1.5 rounded-full transition-all bg-white text-[#346BF1] shadow-xs">
          Ambassador
        </button>
        <button onclick="setRole('participant')" id="btn-role-participant" class="px-3.5 py-1.5 rounded-full transition-all text-gray-600 hover:text-gray-900">
          Student Participant
        </button>
      </div>

      <!-- Ambassador Score Pill -->
      <div id="header-ambassador-actions" class="flex items-center space-x-2">
        <button onclick="openScoreModal()" class="bg-[#346BF1] hover:bg-[#2851C6] px-5 py-2 rounded-full text-white font-bold text-xs sm:text-sm shadow-sm transition-colors cursor-pointer" id="header-score-pill">
          Score: 200 pts
        </button>
        <button onclick="openProfileModal()" class="p-2 rounded-full border border-gray-200 hover:border-[#346BF1] bg-white text-gray-700 hover:text-[#346BF1] transition-colors shadow-xs" title="Edit Ambassador Profile">
          <i data-lucide="user" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Participant Status Pill -->
      <div id="header-participant-actions" class="hidden">
        <span class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3.5 py-1.5 rounded-full text-xs font-semibold inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          Participant Mode
        </span>
      </div>
    </div>
  </header>

  <!-- Main Body Layout (Sidebar + Content) -->
  <div class="flex flex-1 overflow-hidden z-10 relative max-w-[1600px] w-full mx-auto pt-6 px-4 md:px-6">
    
    <!-- Left Floating Sidebar -->
    <aside id="portal-sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-56 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col pt-20 lg:pt-0 pr-4 bg-[#F8FAFF] lg:bg-transparent">
      <div class="bg-white rounded-3xl shadow-xs border border-gray-100 flex flex-col justify-between h-[calc(100vh-140px)] p-3">
        <!-- Nav Links (Rendered dynamically based on Role) -->
        <nav class="space-y-1.5" id="sidebar-nav">
          <!-- Rendered by app.js -->
        </nav>

        <!-- Sidebar Footer -->
        <div class="pt-2 border-t border-gray-100" id="sidebar-footer">
          <!-- Rendered by app.js -->
        </div>
      </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/20 z-30 hidden lg:hidden"></div>

    <!-- Main Scrollable Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-16">
      <!-- Content rendered by app.js -->
    </main>
  </div>

  <!-- WhatsApp Floating Widget matching screenshot (No emojis, crisp SVG) -->
  <a href="https://wa.me/919217374178?text=Hi%2C%20How%20can%20you%20help%20with%20GSA%3F" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 z-30 bg-[#25D366] hover:bg-[#128C7E] text-white px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-2 text-xs font-bold transition-transform hover:scale-105" aria-label="GSA Chatbot">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
    <span>GSA Chatbot</span>
  </a>

  <!-- Modals Container -->
  <div id="portal-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4"></div>

  <!-- Toast Notification -->
  <div id="gsa-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
